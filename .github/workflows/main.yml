name: Build PS5 Payload

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang lld make git cmake

      - name: Setup PS5 SDK
        run: |
          git clone --recursive https://github.com/ps5-payload-dev/sdk.git ps5-sdk
          echo "PS5_PAYLOAD_SDK=$GITHUB_WORKSPACE/ps5-sdk" >> $GITHUB_ENV
          echo "PS5_SDK=$GITHUB_WORKSPACE/ps5-sdk" >> $GITHUB_ENV

      - name: Verify Prospero Toolchain File
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/ps5-sdk/toolchain/prospero.mk" ]; then
            echo "Creating missing prospero.mk link..."
            mkdir -p $GITHUB_WORKSPACE/ps5-sdk/toolchain
            curl -sSL https://raw.githubusercontent.com/ps5-payload-dev/sdk/main/toolchain/prospero.mk -o $GITHUB_WORKSPACE/ps5-sdk/toolchain/prospero.mk || true
          fi

      - name: Build Payload
        run: |
          cd payload
          make clean || true
          make

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PoorDS4-Fixed-ELF
          path: payload/*.elf
