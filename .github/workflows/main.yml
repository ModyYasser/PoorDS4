name: Build PS5 Payload

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang lld make git cmake

      - name: Setup Blurf PS5 SDK
        run: |
          git clone --recursive https://github.com/ItsBlurf/ps5-payload-sdk.git blurf-sdk || git clone --recursive https://github.com/ps5-payload-dev/sdk.git blurf-sdk
          echo "PS5_PAYLOAD_SDK=$GITHUB_WORKSPACE/blurf-sdk" >> $GITHUB_ENV
          echo "PS5_SDK=$GITHUB_WORKSPACE/blurf-sdk" >> $GITHUB_ENV

      - name: Build Payload
        run: |
          cd payload
          make clean || true
          make

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PoorDS4-Fixed-ELF
          path: payload/*.elf
