name: Build PS5 Payload

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang lld make git

      - name: Setup PS5 SDK
        run: |
          git clone https://github.com/ps5-payload-dev/sdk.git ps5-sdk
          echo "PS5_SDK=$GITHUB_WORKSPACE/ps5-sdk" >> $GITHUB_ENV

      - name: Build Payload
        run: |
          cd payload
          make clean
          make

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PoorDS4-Fixed-ELF
          path: payload/*.elf
